<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10110f" />
    <title>Page not found — P Lakshmi Venkatesha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; color: #f0f0e9; background: #10110f; font-family: 'Space Grotesk', sans-serif; }
      main { width: min(560px, 100%); padding: 42px; border: 1px solid #ffffff22; background: #171916; }
      .code { color: #c5fa5f; font: 11px 'DM Mono', monospace; }
      h1 { margin: 22px 0 10px; font-size: 52px; line-height: 1; }
      p { color: #9a9d94; font-size: 14px; line-height: 1.7; }
      a { display: inline-flex; align-items: center; gap: 14px; margin-top: 16px; padding: 14px 17px; color: #10130b; background: #c5fa5f; font-size: 12px; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid #c5fa5f; outline-offset: 4px; }
      @media (max-width: 480px) { main { padding: 26px; } h1 { font-size: 40px; } }
    </style>
  </head>
  <body>
    <main>
      <span class="code">ERROR / 404</span>
      <h1>Lost in the stack?</h1>
      <p>This page doesn’t exist. Let’s get you back to the portfolio.</p>
      <a href="/">Back to home <span aria-hidden="true">↗</span></a>
    </main>
  </body>
</html>
